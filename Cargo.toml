[workspace]
resolver = "2"
members = ["crates/bootmap-core", "crates/bootmap"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.11"
fontdue = "0.9"
dbus = "0.9"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

# `cargo run` without --release: optimize dependencies (the renderer lives in
# tiny-skia and fontdue) so debug builds stay interactive.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
