name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Clippy on every build variant, warnings are errors
        run: |
          variants=(
            ""
            "--no-default-features --features drm"
            "--no-default-features --features window"
            "--no-default-features --features tools"
          )
          for variant in "${variants[@]}"; do
            read -ra flags <<< "$variant"
            echo "::group::cargo clippy $variant"
            nix develop -c cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
            echo "::endgroup::"
          done

  build:
    name: Build and unit tests (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Building the packages runs the unit tests.
      - name: Packages
        run: nix build -L .#packages.${{ matrix.system }}.bootmap .#packages.${{ matrix.system }}.bootmap-minimal
      - name: A misspelled setting fails the build
        run: nix build -L .#checks.${{ matrix.system }}.bad-config

  vm-test:
    name: NixOS VM test (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: VM test
        run: nix build -L .#checks.x86_64-linux.vm
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-test-screenshots
          path: result/
          if-no-files-found: ignore
